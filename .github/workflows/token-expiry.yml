name: Token Expiry

# AGENT_PAT is the loop's single point of failure. agent-implement pushes the
# branch with it, opens the PR with it, and adds the `agent:review` label with
# it — and that last one is why a lapse is so quiet: a label add that fails just
# means the review never starts. Nothing announces a 401.
#
# This turns an invisible expiry into a dated, recurring warning. It is a
# stopgap: the real fix is a GitHub App with per-run tokens (parity.md §9.4),
# which retires the expiry problem rather than monitoring it.
on:
  schedule:
    # Weekly, Monday. Offset from corpus.yml's 06:17 so the two do not queue up.
    - cron: "23 7 * * 1"
  workflow_dispatch:
  # TEMPORARY — remove before merge. Lets the logic be exercised on the branch
  # rather than merged untested; workflow_dispatch only works from the default
  # branch, so there is no other way to run this before it lands.
  push:
    branches: [chore/agent-pat-expiry-check]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Two full weeks of Mondays before the deadline, so a warning cannot be
      # missed by being on holiday for one of them.
      WARN_DAYS: "21"
      ISSUE_TITLE: "AGENT_PAT is expiring"
    steps:
      - name: Check AGENT_PAT expiry
        id: check
        env:
          PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -uo pipefail

          if [ -z "$PAT" ]; then
            echo "::warning::AGENT_PAT is not set. The loop falls back to GITHUB_TOKEN, which cannot create PRs and whose pushes do not trigger CI."
            echo "state=unset" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub returns this header for any PAT that carries an expiry date.
          # Fine-grained tokens always do; a classic token set to "no expiration"
          # omits it.
          expiry=$(curl -sI -H "Authorization: token $PAT" https://api.github.com/user \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')

          if [ -z "$expiry" ]; then
            echo "AGENT_PAT carries no expiry date — nothing to track."
            echo "state=no-expiry" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "AGENT_PAT expires: $expiry"
          expiry_epoch=$(date -u -d "$expiry" +%s) || {
            echo "::warning::Could not parse expiry '$expiry'."
            echo "state=unparseable" >> "$GITHUB_OUTPUT"
            exit 0
          }
          days=$(( (expiry_epoch - $(date -u +%s)) / 86400 ))

          echo "days=$days"        >> "$GITHUB_OUTPUT"
          echo "expiry=$expiry"    >> "$GITHUB_OUTPUT"
          echo "Days remaining: $days"

          if [ "$days" -le 0 ]; then
            echo "state=expired" >> "$GITHUB_OUTPUT"
          elif [ "$days" -le "$WARN_DAYS" ]; then
            echo "state=expiring" >> "$GITHUB_OUTPUT"
          else
            echo "state=ok" >> "$GITHUB_OUTPUT"
            echo "::notice::AGENT_PAT is valid for $days more days (expires $expiry)."
          fi

      # One open issue at a time, reused rather than duplicated — a new issue
      # every Monday would train you to ignore it.
      - name: Raise or update the reminder issue
        if: steps.check.outputs.state == 'expiring' || steps.check.outputs.state == 'expired'
        env:
          STATE: ${{ steps.check.outputs.state }}
          DAYS: ${{ steps.check.outputs.days }}
          EXPIRY: ${{ steps.check.outputs.expiry }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "$STATE" = "expired" ]; then
            headline="**\`AGENT_PAT\` has expired** (expiry: $EXPIRY)."
          else
            headline="**\`AGENT_PAT\` expires in $DAYS days** (expiry: $EXPIRY)."
          fi

          body_file="${RUNNER_TEMP}/expiry.md"
          {
            echo "$headline"
            echo
            echo "Every agent workflow depends on it. When it lapses:"
            echo
            echo "- \`agent-implement\` cannot push the branch or open the PR;"
            echo "- the \`agent:review\` label add becomes a **silent no-op**, so reviews simply stop happening."
            echo
            echo "Rotate it in Settings → Developer settings → Personal access tokens, then update the"
            echo "\`AGENT_PAT\` repository secret. Close this issue once done; it will reopen if the new"
            echo "token is also close to expiry."
            echo
            echo "Longer-term fix: a GitHub App with per-run tokens (\`docs/parity.md\` §9.4) removes the"
            echo "expiry problem instead of monitoring it."
            echo
            echo "_Raised automatically by [Token Expiry]($RUN_URL)._"
          } > "$body_file"

          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file "$body_file"
          fi

      # Fail the run as well as filing the issue. The issue is the signal a human
      # acts on; a red run is what makes it visible from the Actions tab alone.
      - name: Fail when expiring
        if: steps.check.outputs.state == 'expiring' || steps.check.outputs.state == 'expired'
        run: |
          echo "::error::AGENT_PAT ${{ steps.check.outputs.state }} — expires ${{ steps.check.outputs.expiry }} (${{ steps.check.outputs.days }} days)."
          exit 1
