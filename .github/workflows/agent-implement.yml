name: Agent Implement

on:
  issues:
    types: [labeled]

jobs:
  implement:
    # Job-level, deliberately. A job-level `if:` skips without provisioning a
    # runner and costs nothing; a step-level guard has already booted a runner
    # and bills a full rounded-up minute for every unrelated label event.
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-implement-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_STATE: ${{ github.event.issue.state }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      # Two refusals, in order. The state check has to come first: the PR query
      # below lists open PRs only, so an issue whose PR has already merged looks
      # exactly like an issue nobody has started. It then checks out `main`,
      # finds the work already there, and usually dies at "no commits were
      # made" — or, worse, invents a change and opens a duplicate PR (#102).
      #
      # Distinct messages on purpose: "someone is already on this" and "this is
      # finished" call for different things from the human reading them.
      - name: Preflight
        id: preflight
        run: |
          set -euo pipefail
          if [ "$ISSUE_STATE" != "open" ]; then
            echo "refused=true" >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
            gh issue comment "$ISSUE_NUMBER" --body "Refused to run: this issue is not open. Reopen it first, then re-add \`agent:implement\`."
            exit 0
          fi
          existing=$(gh pr list --state open --json number,url,body \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves)\\\\s+#${ISSUE_NUMBER}\\\\b\"))] | .[0].url // empty")
          if [ -n "$existing" ]; then
            echo "refused=true" >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
            gh issue comment "$ISSUE_NUMBER" --body "Refused to run: $existing already targets this issue. Close it first, then re-add \`agent:implement\`."
          else
            echo "refused=false" >> "$GITHUB_OUTPUT"
          fi

      # The trigger label is consumed, not left in place. That is what makes a
      # retry idempotent: a human re-adds it deliberately.
      - name: Transition labels
        if: steps.preflight.outputs.refused == 'false'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout main
        if: steps.preflight.outputs.refused == 'false'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # AGENT_PAT is optional. When absent this falls back to GITHUB_TOKEN,
          # which works — except that pushes made with it do not trigger ci.yml
          # on the resulting PR. Add the secret later and this starts using it
          # with no change to the workflow.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute branch name
        if: steps.preflight.outputs.refused == 'false'
        id: branch
        run: |
          slug=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          echo "name=agent/issue-${ISSUE_NUMBER}-${slug}" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.preflight.outputs.refused == 'false'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Setup Node.js
        if: steps.preflight.outputs.refused == 'false'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.preflight.outputs.refused == 'false'
        run: npm ci

      - name: Install Claude Code
        if: steps.preflight.outputs.refused == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run implementation agent
        if: steps.preflight.outputs.refused == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_IMPLEMENT: ${{ vars.AGENT_MODEL_IMPLEMENT }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/implement/implement.ts

      - name: Push branch
        if: steps.preflight.outputs.refused == 'false' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --force origin "$BRANCH"

      - name: Open draft PR
        if: steps.preflight.outputs.refused == 'false' && success()
        id: open_pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          # gh reads GH_TOKEN from the env. The job-level GH_TOKEN is the
          # built-in GITHUB_TOKEN, and the Actions bot is forbidden from
          # creating PRs ("GitHub Actions is not permitted to create or approve
          # pull requests"). A user PAT is not the Actions bot, so it bypasses
          # that restriction. Fall back to GITHUB_TOKEN so the step still runs
          # in forks/setups without the secret — it will fail the same way, but
          # the workflow shape stays identical.
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          title="Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          body_file="${RUNNER_TEMP}/pr-body.md"
          {
            echo "Closes #${ISSUE_NUMBER}"
            echo
            echo "Implemented by the \`agent:implement\` workflow."
          } > "$body_file"
          pr_url=$(gh pr create --draft --base main --head "$BRANCH" \
            --title "${title:0:256}" --body-file "$body_file" | tail -n1)
          echo "number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"
          echo "Opened $pr_url"

      # Cascade: every agent PR gets reviewed without a human labelling it.
      #
      # Safe because it is exactly one hop — agent-review.yml adds no trigger
      # label of its own, so this cannot cycle. The corresponding invariant
      # (never auto-cascade review -> fix) is recorded in docs/parity.md §10;
      # breaking it would close the loop with no human gate.
      #
      # MUST use AGENT_PAT: a label added with GITHUB_TOKEN does not trigger
      # further workflows, so the label would appear and nothing would happen —
      # a silent no-op. Warn loudly rather than pretend it worked.
      - name: Request review
        if: steps.preflight.outputs.refused == 'false' && success()
        env:
          NEW_PR: ${{ steps.open_pr.outputs.number }}
          HAS_PAT: ${{ secrets.AGENT_PAT != '' }}
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh pr edit "$NEW_PR" --add-label "agent:review"
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::AGENT_PAT is not set, so this label was added with GITHUB_TOKEN and will NOT trigger agent-review. Add agent:review by hand on PR #${NEW_PR}."
          fi

      - name: Mark blocked on failure
        if: steps.preflight.outputs.refused == 'false' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.preflight.outputs.refused == 'false'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
