name: Agent Fix

# Address review feedback on an existing PR: the agent reads collaborator (and
# our own review agent's) comments, fixes the branch, and pushes.
#
# This is the highest-risk workflow in the set: it runs with `contents: write`
# and pushes, so an injection here steers *committed code*, not just text. Two
# controls carry that weight — the same-repo guard below, and the author gate in
# `shared/pr-feedback.ts` that drops anything not written by a collaborator or
# `github-actions[bot]`.

on:
  # pull_request_target so the labeled event fires reliably even when the PR is
  # out of date; the head-repo guard below is what makes that safe.
  pull_request_target:
    types: [labeled]

jobs:
  fix:
    # Job-level, so a fork PR skips before a runner is provisioned — no
    # checkout, no npm ci, no secrets. Fails closed: a deleted fork gives
    # head.repo == null, which also skips.
    if: >-
      github.event.label.name == 'agent:fix' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One group per PR, shared with agent-update-branch.yml (which pushes this
    # same branch) and agent-review.yml (which reads it). Review was outside the
    # group until #102 on the grounds that `contents: read` makes it harmless —
    # but the race was never review writing, it was review *reading* mid-push,
    # so a review could describe a tree that never existed. Nothing wants
    # review and a mutate to overlap on one PR.
    concurrency:
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      # The PR's real base branch — pr-feedback.ts diffs HEAD against this for
      # the DIFF context. A hardcoded `main` describes work the PR does not own
      # on any PR stacked on another branch (#71).
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_STATE: ${{ github.event.pull_request.state }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Pre-flight — refuse if the PR is closed or merged
        id: state
        run: |
          if [ "$PR_STATE" != "open" ] || [ "$PR_MERGED" = "true" ]; then
            gh pr edit "$PR_NUMBER" --remove-label "agent:fix" || true
            gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:fix\`: this PR is not open."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Transition labels
        if: steps.state.outputs.proceed == 'true'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:fix" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR head
        if: steps.state.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      # Shell-safe despite ref names being able to contain `$()`, backticks, `;`,
      # `|` and `&` — see the long note on the same step in
      # agent-review-reusable.yml.
      # Short version: BASE_REF arrives as an `env:` var rather than a workflow
      # expression spliced into this script, and a quoted parameter expansion is
      # not re-scanned for syntax (verified 2026-08-02, #75).
      #
      # This note lives at step level, NOT inside the `run:` block. GitHub
      # evaluates workflow expressions across the whole run script — shell
      # comment lines included — so a literal empty expression written inside a
      # run block is an "An expression was expected" startup failure. That is
      # what took this workflow down for two days; see tests/workflows.test.ts.
      - name: Prepare branch and make the PR base available for diffing
        if: steps.state.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${BASE_REF:-main}:refs/heads/${BASE_REF:-main}"
          git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js
        if: steps.state.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.proceed == 'true'
        run: npm ci

      - name: Install Claude Code
        if: steps.state.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # The runner refuses (non-zero) when there is no trusted feedback, so the
      # "nothing to act on" case surfaces through the normal failure path.
      - name: Run fix agent
        if: steps.state.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Unset variable interpolates to "", and the runner falls back to its
          # own default. Change the model in Settings -> Variables, no commit.
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AGENT_MODEL_FIX: ${{ vars.AGENT_MODEL_FIX }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx --yes @jeffwlawson/agent-workflows@0.1.0 fix

      # --force-with-lease pinned to the SHA we checked out: if anything else
      # advanced the branch during the run, refuse rather than clobber it.
      - name: Push branch
        if: steps.state.outputs.proceed == 'true' && success()
        run: |
          set -euo pipefail
          if [ -z "$(git log origin/"$BRANCH"..HEAD --oneline 2>/dev/null)" ]; then
            echo "No new commits — nothing to push."
            exit 0
          fi
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH"

      # Reply into every thread the agent reported on, and resolve only the ones
      # it addressed. A declined thread keeps its reply but stays OPEN, so a
      # human can push back — auto-resolving a decline would let the agent
      # quietly bury a disagreement.
      #
      # Both are GraphQL mutations keyed on the thread node id, so no REST
      # comment-id lookup is needed. Runs even when the agent made no commits:
      # "I looked and declined" is still worth saying out loud.
      - name: Reply to and resolve review threads
        if: steps.state.outputs.proceed == 'true' && success()
        continue-on-error: true
        env:
          OUTCOMES: ${{ runner.temp }}/thread_outcomes.json
        run: |
          set -uo pipefail
          [ -f "$OUTCOMES" ] || { echo "No outcomes file; nothing to post."; exit 0; }
          count=$(jq 'length' "$OUTCOMES")
          echo "Posting ${count} thread outcome(s)."

          for i in $(seq 0 $((count - 1))); do
            tid=$(jq -r ".[$i].threadId" "$OUTCOMES")
            status=$(jq -r ".[$i].status" "$OUTCOMES")
            body=$(jq -r ".[$i].reply" "$OUTCOMES")

            gh api graphql -f threadId="$tid" -f body="$body" -f query='
              mutation($threadId:ID!,$body:String!) {
                addPullRequestReviewThreadReply(
                  input:{pullRequestReviewThreadId:$threadId, body:$body}
                ) { clientMutationId }
              }' >/dev/null \
              && echo "  replied to ${tid}" \
              || echo "  WARNING: reply failed for ${tid}"

            if [ "$status" = "addressed" ]; then
              gh api graphql -f threadId="$tid" -f query='
                mutation($threadId:ID!) {
                  resolveReviewThread(input:{threadId:$threadId}) { clientMutationId }
                }' >/dev/null \
                && echo "  resolved ${tid}" \
                || echo "  WARNING: resolve failed for ${tid}"
            fi
          done

      # Findings that belong to no thread: something out of scope noticed while
      # fixing, a refusal spanning threads, a cross-cutting observation. Posted
      # by the workflow from validated structured output — never by the agent,
      # which no longer holds a token by this point.
      #
      # Silence is the normal outcome. Most runs answer their threads and have
      # nothing else to say, and a bot that comments on every run is the noise
      # that teaches a reader to skim. The runner caps and dedupes the list, so
      # that is bounded mechanically rather than by the prompt alone
      # (`filterTopLevelComments`), and every body it writes carries
      # `<!-- agent-fix:top-level -->` so the next run does not read this run's
      # own note back as feedback to act on. `pull-requests: write` is already
      # granted and nothing new is needed; `issues: write` is deliberately NOT —
      # an agent that raises work does not file it (docs/parity.md §10).
      - name: Post top-level comments
        if: steps.state.outputs.proceed == 'true' && success()
        continue-on-error: true
        env:
          COMMENTS: ${{ runner.temp }}/top_level_comments.json
        run: |
          set -uo pipefail
          [ -f "$COMMENTS" ] || { echo "No comments file; nothing to post."; exit 0; }
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            echo "No top-level comments — nothing outside the threads."
            exit 0
          fi
          echo "Posting ${count} top-level comment(s)."

          for i in $(seq 0 $((count - 1))); do
            body_file="${RUNNER_TEMP}/top-level-comment-${i}.md"
            jq -r ".[$i].body" "$COMMENTS" > "$body_file"
            gh pr comment "$PR_NUMBER" --body-file "$body_file" >/dev/null \
              && echo "  posted comment ${i}" \
              || echo "  WARNING: failed to post comment ${i}"
          done

      - name: Mark blocked on failure
        if: steps.state.outputs.proceed == 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:fix` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:fix` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.state.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
